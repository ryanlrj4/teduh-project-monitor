[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teduh-project-monitor"
version = "0.2.0"
description = "Regional monitoring dashboard for selected Malaysian TEDUH housing projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
teduh-monitor = "teduh_monitor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teduh_monitor = ["ui/*.css"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
